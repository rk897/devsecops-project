apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-app
  namespace: dev-environment
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: devsecops-app
  template:
    metadata:
      labels:
        app: devsecops-app
    spec:
      containers:
      - name: app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 5000
